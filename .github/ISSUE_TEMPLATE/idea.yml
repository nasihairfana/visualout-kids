name: Idea or request
description: Suggest a new game, mode or improvement
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and how would it help young children?
    validations:
      required: true
  - type: input
    id: age
    attributes:
      label: Child's age (optional)
